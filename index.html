lt="FC Salèves"></header><div class="tools"><select id="formation"><option value="232">2-3-2</option><option value="331">3-3-1</option><option value="322">3-2-2</option></select></div><div class="attack">⬆️ ATTAQUE ⬆️</div><section id="pitch" class="pitch"><div class="arc"></div><div class="box"></div><div class="six"></div><div class="goal"></div></section><section class="bench"><b>🪑 Remplaçants</b><div id="bench" class="benchgrid"></div></section><div class="actions"><button id="reset">↻ Replacer</button><button id="shuffle">🔀 Mélanger</button></div><div id="status" class="status">Touchez deux joueurs pour les échanger. Glissez les joueurs sur le terrain.</div></main><script>const names=['Clément','Doryann','Liam','Nolan','Mylan','Kaïs','Edgard','Sohan','Antoine','Nathan','Lyam','Loup','Anoussone','Loris','Diego','Aïden','Andreas'];const layouts={232:[[50,90],[30,70],[70,70],[17,47],[50,50],[83,47],[35,20],[65,20]],331:[[50,90],[20,70],[50,73],[80,70],[18,46],[50,48],[82,46],[50,19]],322:[[50,90],[20,70],[50,73],[80,70],[34,47],[66,47],[35,20],[65,20]]};const pitch=document.querySelector('#pitch'),bench=document.querySelector('#bench'),form=document.querySelector('#formation'),status=document.querySelector('#status');let field=JSON.parse(localStorage.getItem('as-field')||'null')||names.slice(0,8),sel=null;form.value=localStorage.getItem('as-form')||'232';function save(){localStorage.setItem('as-field',JSON.stringify(field));localStorage.setItem('as-form',form.value)}function clear(){document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));sel=null}function pick(name,el){if(!sel){sel=name;el.classList.add('selected');status.textContent=name+' sélectionné : touchez le joueur à échanger.';return}if(sel===name){clear();return}let a=field.indexOf(sel),b=field.indexOf(name);if(a>=0&&b<0)field[a]=name;else if(a<0&&b>=0)field[b]=sel;else if(a>=0&&b>=0)[field[a],field[b]]=[field[b],field[a]];clear();save();draw();status.textContent='Changement effectué ✓'}function move(el,x,y){let r=pitch.getBoundingClientRect();el.style.left=Math.max(7,Math.min(93,(x-r.left)/r.width*100))+'%';el.style.top=Math.max(8,Math.min(92,(y-r.top)/r.height*100))+'%'}function draw(){pitch.querySelectorAll('.player').forEach(x=>x.remove());let xy=layouts[form.value];field.forEach((n,i)=>{let b=document.createElement('button');b.className='player';b.textContent=n;b.style.left=xy[i][0]+'%';b.style.top=xy[i][1]+'%';let drag=false;b.onpointerdown=e=>{drag=true;b.setPointerCapture?.(e.pointerId);pick(n,b)};b.onpointermove=e=>{if(drag)move(b,e.clientX,e.clientY)};b.onpointerup=()=>drag=false;b.onclick=e=>{e.stopPropagation();pick(n,b)};pitch.appendChild(b)});bench.innerHTML='';names.filter(n=>!field.includes(n)).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>pick(n,b);bench.appendChild(b)})}form.onchange=()=>{clear();save();draw()};document.querySelector('#reset').onclick=()=>{field=names.slice(0,8);save();draw()};document.querySelector('#shuffle').onclick=()=>{let a=[...names];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}field=a.slice(0,8);save();draw()};draw();</script></body></html>
