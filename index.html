<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174b8a"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>ARTHAZ SALEVE</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f5f7;color:#10233b}.app{max-width:820px;margin:auto;padding:12px}.head{display:flex;align-items:center;justify-content:center;gap:14px}.head img{width:68px;height:68px;object-fit:contain;border-radius:12px;background:#fff}.head h1{font-size:22px;margin:0;text-align:center}.head small{display:block;text-align:center;color:#657080}.tools,.actions{display:flex;gap:8px;margin:10px 0}.tools select,.actions button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #ccd3dc;background:#fff}.actions button{flex:1;font-weight:700}.attack{text-align:center;font-weight:800;margin:5px}.pitch{position:relative;width:100%;aspect-ratio:1.05;background:#21834b;border:3px solid white;border-radius:14px;overflow:hidden;touch-action:none}.box{position:absolute;left:14%;right:14%;bottom:0;height:29%;border:2px solid #fff;border-bottom:0}.six{position:absolute;left:33%;right:33%;bottom:0;height:12%;border:2px solid #fff;border-bottom:0}.goal{position:absolute;left:39%;right:39%;bottom:0;border-top:5px solid white}.arc{position:absolute;width:110px;height:55px;left:50%;top:0;transform:translateX(-50%);border:2px solid white;border-top:0;border-radius:0 0 60px 60px}.player{position:absolute;transform:translate(-50%,-50%);width:78px;min-height:48px;border:3px solid white;border-radius:30px;background:#fff;color:#10233b;font-weight:800;font-size:12px;box-shadow:0 2px 7px #0005;touch-action:none}.selected{outline:4px solid #ffcf33;outline-offset:2px}.bench{background:#fff;border-radius:14px;padding:12px;margin-top:10px}.benchgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bench button{min-height:44px;border:1px solid #ccd3dc;background:#f8fafc;border-radius:10px;font-weight:700}.status{font-size:13px;color:#657080;margin:9px 2px}@media(max-width:420px){.head img{width:54px;height:54px}.head h1{font-size:18px}.player{width:64px;font-size:10px}.benchgrid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="app"><header class="head"><img src="arthaz.jpeg" alt="Arthaz Sports"><div><h1>ARTHAZ × SALEVE</h1><small>U11 • 8 contre 8</small></div><img src="saleve.jpeg" alt="FC Salèves"></header><div class="tools"><select id="formation"><option value="232">2-3-2</option><option value="331">3-3-1</option><option value="322">3-2-2</option></select></div><div class="attack">⬆️ ATTAQUE ⬆️</div><section id="pitch" class="pitch"><div class="arc"></div><div class="box"></div><div class="six"></div><div class="goal"></div></section><section class="bench"><b>🪑 Remplaçants</b><div id="bench" class="benchgrid"></div></section><div class="actions"><button id="reset">↻ Replacer</button><button id="shuffle">🔀 Mélanger</button></div><div id="status" class="status">Touchez deux joueurs pour les échanger. Glissez les joueurs sur le terrain.</div></main><script>const names=['Clément','Doryann','Liam','Nolan','Mylan','Kaïs','Edgard','Sohan','Antoine','Nathan','Lyam','Loup','Anoussone','Loris','Diego','Aïden','Andreas'];const layouts={232:[[50,90],[30,70],[70,70],[17,47],[50,50],[83,47],[35,20],[65,20]],331:[[50,90],[20,70],[50,73],[80,70],[18,46],[50,48],[82,46],[50,19]],322:[[50,90],[20,70],[50,73],[80,70],[34,47],[66,47],[35,20],[65,20]]};const pitch=document.querySelector('#pitch'),bench=document.querySelector('#bench'),form=document.querySelector('#formation'),status=document.querySelector('#status');let field=JSON.parse(localStorage.getItem('as-field')||'null')||names.slice(0,8),sel=null;form.value=localStorage.getItem('as-form')||'232';function save(){localStorage.setItem('as-field',JSON.stringify(field));localStorage.setItem('as-form',form.value)}function clear(){document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));sel=null}function pick(name,el){if(!sel){sel=name;el.classList.add('selected');status.textContent=name+' sélectionné : touchez le joueur à échanger.';return}if(sel===name){clear();return}let a=field.indexOf(sel),b=field.indexOf(name);if(a>=0&&b<0)field[a]=name;else if(a<0&&b>=0)field[b]=sel;else if(a>=0&&b>=0)[field[a],field[b]]=[field[b],field[a]];clear();save();draw();status.textContent='Changement effectué ✓'}function move(el,x,y){let r=pitch.getBoundingClientRect();el.style.left=Math.max(7,Math.min(93,(x-r.left)/r.width*100))+'%';el.style.top=Math.max(8,Math.min(92,(y-r.top)/r.height*100))+'%'}function draw(){pitch.querySelectorAll('.player').forEach(x=>x.remove());let xy=layouts[form.value];field.forEach((n,i)=>{let b=document.createElement('button');b.className='player';b.textContent=n;b.style.left=xy[i][0]+'%';b.style.top=xy[i][1]+'%';let drag=false;b.onpointerdown=e=>{drag=true;b.setPointerCapture?.(e.pointerId);pick(n,b)};b.onpointermove=e=>{if(drag)move(b,e.clientX,e.clientY)};b.onpointerup=()=>drag=false;b.onclick=e=>{e.stopPropagation();pick(n,b)};pitch.appendChild(b)});bench.innerHTML='';names.filter(n=>!field.includes(n)).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>pick(n,b);bench.appendChild(b)})}form.onchange=()=>{clear();save();draw()};document.querySelector('#reset').onclick=()=>{field=names.slice(0,8);save();draw()};document.querySelector('#shuffle').onclick=()=>{let a=[...names];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}field=a.slice(0,8);save();draw()};draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
